<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机器人焊接缺陷智能预测系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">&#9881;</span>
                <h1>机器人焊接缺陷智能预测系统</h1>
            </div>
            <div class="header-info">
                <span class="status-dot" id="serverStatus"></span>
                <span id="serverStatusText">系统运行中</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- 统计概览卡片 -->
        <section class="stats-row">
            <div class="stat-card">
                <div class="stat-label">总预测次数</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">正常次数</div>
                <div class="stat-value stat-normal" id="statNormal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">缺陷预警</div>
                <div class="stat-value stat-warning" id="statDefect">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">缺陷率</div>
                <div class="stat-value" id="statRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">模型准确率</div>
                <div class="stat-value stat-accuracy" id="statAccuracy">--</div>
            </div>
        </section>

        <!-- 输入与结果区 -->
        <section class="content-row">
            <!-- 左侧：参数输入 -->
            <div class="panel input-panel">
                <div class="panel-header">
                    <h2>焊接工艺参数输入</h2>
                    <button class="btn-reset" id="btnReset" title="重置参数">重置</button>
                </div>
                <div class="panel-body">
                    <form id="predictForm">
                        <div class="form-grid">
                            <div class="form-item">
                                <label for="arc_voltage">电弧电压 <span class="unit">(V)</span></label>
                                <input type="number" id="arc_voltage" name="arc_voltage" step="0.01" min="0" max="50" placeholder="例如: 22.5" required>
                            </div>
                            <div class="form-item">
                                <label for="welding_current">焊接电流 <span class="unit">(A)</span></label>
                                <input type="number" id="welding_current" name="welding_current" step="0.01" min="0" max="500" placeholder="例如: 180.0" required>
                            </div>
                            <div class="form-item">
                                <label for="welding_speed">焊接速度 <span class="unit">(cm/min)</span></label>
                                <input type="number" id="welding_speed" name="welding_speed" step="0.01" min="0" max="100" placeholder="例如: 30.0" required>
                            </div>
                            <div class="form-item">
                                <label for="wire_feed_speed">送丝速度 <span class="unit">(m/min)</span></label>
                                <input type="number" id="wire_feed_speed" name="wire_feed_speed" step="0.01" min="0" max="30" placeholder="例如: 8.0" required>
                            </div>
                            <div class="form-item">
                                <label for="gas_flow_rate">气体流量 <span class="unit">(L/min)</span></label>
                                <input type="number" id="gas_flow_rate" name="gas_flow_rate" step="0.01" min="0" max="50" placeholder="例如: 15.0" required>
                            </div>
                            <div class="form-item">
                                <label for="torch_angle">焊枪角度 <span class="unit">(°)</span></label>
                                <input type="number" id="torch_angle" name="torch_angle" step="0.01" min="0" max="90" placeholder="例如: 25.0" required>
                            </div>
                            <div class="form-item form-item-full">
                                <label for="base_metal_temperature">母材温度 <span class="unit">(°C)</span></label>
                                <input type="number" id="base_metal_temperature" name="base_metal_temperature" step="0.01" min="0" max="200" placeholder="例如: 50.0" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-predict" id="btnPredict">
                            <span class="btn-text">开始预测</span>
                            <span class="btn-loading" style="display:none;">预测中...</span>
                        </button>
                    </form>
                    <div class="quick-fill">
                        <span>快捷填充：</span>
                        <button class="btn-quick" data-type="normal">正常参数示例</button>
                        <button class="btn-quick" data-type="defect">异常参数示例</button>
                    </div>
                </div>
            </div>

            <!-- 右侧：预测结果 -->
            <div class="panel result-panel">
                <div class="panel-header">
                    <h2>预测结果</h2>
                </div>
                <div class="panel-body">
                    <div id="resultPlaceholder" class="result-placeholder">
                        <div class="placeholder-icon">&#128269;</div>
                        <p>请输入焊接工艺参数后点击"开始预测"</p>
                    </div>
                    <div id="resultContent" style="display:none;">
                        <div class="result-status" id="resultStatus">
                            <span class="status-badge" id="statusBadge">--</span>
                        </div>
                        <div class="result-detail">
                            <div class="result-item">
                                <span class="result-label">缺陷概率</span>
                                <div class="progress-bar">
                                    <div class="progress-fill" id="probBar"></div>
                                </div>
                                <span class="result-value" id="probValue">0%</span>
                            </div>
                            <div class="result-item">
                                <span class="result-label">正常概率</span>
                                <div class="progress-bar">
                                    <div class="progress-fill progress-normal" id="normalBar"></div>
                                </div>
                                <span class="result-value" id="normalValue">0%</span>
                            </div>
                            <div class="result-item">
                                <span class="result-label">预测置信度</span>
                                <span class="result-value highlight" id="confValue">--</span>
                            </div>
                        </div>
                        <div class="result-message" id="resultMessage"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 图表区 -->
        <section class="content-row">
            <div class="panel chart-panel">
                <div class="panel-header">
                    <h2>特征重要性分析</h2>
                </div>
                <div class="panel-body">
                    <div id="importanceChart" class="chart-container"></div>
                </div>
            </div>
            <div class="panel chart-panel">
                <div class="panel-header">
                    <h2>历史预测分布</h2>
                </div>
                <div class="panel-body">
                    <div id="distributionChart" class="chart-container"></div>
                </div>
            </div>
        </section>

        <!-- 历史记录 -->
        <section class="panel history-panel">
            <div class="panel-header">
                <h2>历史预测记录</h2>
                <button class="btn-refresh" id="btnRefreshHistory">刷新</button>
            </div>
            <div class="panel-body">
                <div class="table-wrapper">
                    <table class="history-table" id="historyTable">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>预测时间</th>
                                <th>电弧电压(V)</th>
                                <th>焊接电流(A)</th>
                                <th>焊接速度(cm/min)</th>
                                <th>送丝速度(m/min)</th>
                                <th>气体流量(L/min)</th>
                                <th>焊枪角度(°)</th>
                                <th>母材温度(°C)</th>
                                <th>预测结果</th>
                                <th>缺陷概率</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <tr>
                                <td colspan="11" class="empty-row">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>制造智能技术课程设计 | 基于焊接工艺参数的机器人焊接缺陷智能预测系统</p>
    </footer>

    <!-- 错误提示弹窗 -->
    <div class="toast" id="toast"></div>

    <script src="/static/js/main.js"></script>
</body>
</html>
